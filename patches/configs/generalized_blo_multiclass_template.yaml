# Multi-class template for food, natural-object, small-object or medical datasets.
# Copy this file and modify only dataset paths, class names and semantic-prior files.
experiment:
  name: generalized_blo_multiclass
  description: "Multi-domain generalized BLO-Inst"

dataset:
  yaml: data/custom_generalized.yaml
  overlap_masks: true
  mask_ratio: 4

model:
  cfg: yolov7-seg.yaml
  weights: weights/yolov7-seg.pt

sam:
  vit_name: vit_b
  checkpoint: weights/sam_vit_b_01ec64.pth
  lora_rank: 4

foundation:
  enabled: true
  model_name: ViT-B/32
  fallback_dim: 512

refiner:
  enabled: true
  use_attention: true
  hidden_dim: 256
  num_heads: 8
  num_layers: 2
  dropout: 0.10
  max_center_shift: 0.25
  max_log_scale: 0.35

semantic_prior:
  enabled: true
  path: data/semantic_priors/custom_prior.json
  context_map: data/contexts/custom_context.json
  default_context: default
  initial_alpha: 0.35
  learnable_alpha: true
  max_alpha: 2.0

training:
  device: "0"
  imgsz: 512
  batch_size: 2
  epochs: 60
  workers: 4
  seed: 2026
  inner_split_ratio: 0.50
  amp: true
  cache: null

optimization:
  detector_lr: 0.00010
  refiner_lr: 0.00050
  prior_lr: 0.00100
  sam_lr: 0.00020
  weight_decay: 0.00010
  sam_weight_decay: 0.0
  max_grad_norm: 10.0

loss:
  lambda_mask: 0.70
  lambda_constraint: 0.08
  lambda_semantic: 0.05
  lambda_quality: 0.05
  min_match_iou: 0.05
  min_area_ratio: 0.55
  max_area_ratio: 1.80
  max_center_shift: 0.20

inference:
  conf_thres: 0.001
  nms_iou: 0.25
  max_det: 300
  agnostic_nms: false
  quality_gain: 0.25

validation:
  split: val
  batch_size: 1
  interval: 1

output:
  directory: runs/generalized_blo_multiclass

hyperparameters:
  lr0: 0.001
  lr_sam: 0.001
  lrf: 0.1
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 0.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 0.3
  cls: 0.3
  cls_pw: 1.0
  obj: 0.7
  obj_pw: 1.0
  iou_t: 0.20
  anchor_t: 4.0
  fl_gamma: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.2
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  paste_in: 0.0
  loss_ota: 1
